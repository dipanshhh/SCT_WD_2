<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DD TECH | Stopwatch</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stopwatch-container">

        <p class="brand">DD<span>TECH</span></p>

        <p class="subtitle">STOPWATCH APPLICATION</p>

        <h1>Stopwatch</h1>

        <!-- Time Display -->
        <div class="display" id="display">
            00:00:00.00
        </div>

        <!-- Main Buttons -->
        <div class="buttons">

            <button id="startBtn" onclick="startStopwatch()">
                ▶ Start
            </button>

            <button id="pauseBtn" onclick="pauseStopwatch()">
                ⏸ Pause
            </button>

            <button id="resetBtn" onclick="resetStopwatch()">
                ↻ Reset
            </button>

        </div>

        <!-- Lap Button -->
        <button class="lap-btn" onclick="recordLap()">
            🏁 Record Lap
        </button>


        <!-- Lap Section -->
        <div class="laps-container">

            <h2>Lap Times</h2>

            <div id="laps">
                <p class="empty">No laps recorded yet</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
